<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-chorus live</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; background: #0d1117; color: #c9d1d9; font-size: 13px; }

header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 16px; color: #58a6ff; font-weight: 600; }
.connection { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.connected { background: #3fb950; }
.dot.disconnected { background: #f85149; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.mission-id { color: #8b949e; font-size: 12px; }

.layout { display: flex; height: calc(100vh - 49px); }

/* Sidebar: Agent roster */
.sidebar { width: 240px; border-right: 1px solid #30363d; overflow-y: auto; background: #0d1117; }
.sidebar h2 { padding: 12px 16px 8px; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.agent-card { padding: 8px 16px; border-bottom: 1px solid #21262d; cursor: pointer; }
.agent-card:hover { background: #161b22; }
.agent-card.selected { background: #1f2937; border-left: 3px solid #58a6ff; }
.agent-name { font-weight: 600; color: #58a6ff; font-size: 13px; }
.agent-role { color: #8b949e; font-size: 11px; }
.agent-status { font-size: 11px; margin-top: 2px; }
.agent-status.active { color: #3fb950; }
.agent-status.done { color: #8b949e; }
.agent-status.failed { color: #f85149; }
.agent-status.spawning { color: #d29922; }

/* Main content */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.tabs { display: flex; gap: 0; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; }
.tab { padding: 10px 16px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; font-size: 13px; }
.tab:hover { color: #c9d1d9; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }

.panel-container { flex: 1; overflow-y: auto; padding: 16px; }
.panel { display: none; }
.panel.active { display: block; }

/* Live feed */
.feed-event { display: flex; gap: 10px; padding: 5px 8px; border-radius: 4px; align-items: baseline; animation: fadeIn 0.3s ease; }
.feed-event:hover { background: #161b22; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.feed-time { color: #484f58; min-width: 65px; font-size: 11px; }
.feed-agent { min-width: 130px; font-weight: 600; font-size: 12px; }
.feed-kind { min-width: 150px; font-size: 12px; }
.feed-detail { color: #8b949e; font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-detail:hover { white-space: normal; }

/* Kind colors */
.k-lifecycle { color: #a5d6ff; }
.k-llm { color: #d2a8ff; }
.k-tool { color: #7ee787; }
.k-message { color: #ffa657; }
.k-lease { color: #f778ba; }
.k-room { color: #79c0ff; }
.k-gate { color: #ffd700; }
.k-git { color: #ff7b72; }
.k-agent { color: #d2a8ff; }
.k-capability { color: #f0883e; }
.k-decision { color: #56d364; }
.k-wait { color: #8b949e; }
.k-file { color: #7ee787; }

/* Agent colors for sidebar/feed */
.ac-0 { color: #58a6ff; }
.ac-1 { color: #3fb950; }
.ac-2 { color: #d2a8ff; }
.ac-3 { color: #ffa657; }
.ac-4 { color: #f778ba; }
.ac-5 { color: #79c0ff; }
.ac-6 { color: #ffd700; }
.ac-7 { color: #ff7b72; }

/* Stats bar */
.stats { display: flex; gap: 24px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; }
.stat-value { color: #c9d1d9; font-weight: 600; }

/* Swimlanes */
.swimlane { margin-bottom: 20px; }
.swimlane-header { font-weight: 600; margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.swimlane-count { color: #8b949e; font-size: 12px; font-weight: normal; }

.empty { color: #484f58; padding: 40px; text-align: center; font-size: 14px; }

/* Modal */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; }
.modal.active { display: flex; align-items: center; justify-content: center; }
.modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow: auto; }
.modal-content h3 { color: #58a6ff; margin-bottom: 12px; }
.modal-content pre { background: #0d1117; padding: 12px; border-radius: 4px; overflow-x: auto; color: #c9d1d9; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.modal-close { float: right; cursor: pointer; color: #8b949e; font-size: 18px; }
.modal-close:hover { color: #fff; }
</style>
</head>
<body>

<header>
	<h1>pi-chorus</h1>
	<div class="connection">
		<div id="connDot" class="dot disconnected"></div>
		<span id="connText" style="color:#8b949e;font-size:12px">connecting...</span>
	</div>
	<span id="missionId" class="mission-id"></span>
</header>

<div class="layout">
	<div class="sidebar">
		<h2>Agents</h2>
		<div id="agentList">
			<div class="empty" style="padding:20px;font-size:12px">Waiting for agents...</div>
		</div>
	</div>

	<div class="content">
		<div class="stats">
			<span>Events: <span id="statEvents" class="stat-value">0</span></span>
			<span>Agents: <span id="statAgents" class="stat-value">0</span></span>
			<span>Elapsed: <span id="statTime" class="stat-value">0s</span></span>
			<span>Status: <span id="statStatus" class="stat-value">waiting</span></span>
		</div>

		<div class="tabs">
			<div class="tab active" onclick="switchTab('live')">Live Feed</div>
			<div class="tab" onclick="switchTab('swimlanes')">Swimlanes</div>
			<div class="tab" onclick="switchTab('roster')">Roster</div>
		</div>

		<div class="panel-container">
			<div id="live" class="panel active">
				<div id="liveFeed" class="empty">Waiting for events...</div>
			</div>
			<div id="swimlanes" class="panel">
				<div id="swimContent" class="empty">Waiting for events...</div>
			</div>
			<div id="roster" class="panel">
				<div id="rosterContent" class="empty">Waiting for agents to spawn...</div>
			</div>
		</div>
	</div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
	<div class="modal-content">
		<span class="modal-close" onclick="closeModal()">x</span>
		<h3 id="modalTitle"></h3>
		<pre id="modalBody"></pre>
	</div>
</div>

<script>
// State
const events = [];
const agents = new Map(); // agentId -> { roleName, status, mandate, color, events[] }
const agentColors = {};
let colorIdx = 0;
let missionId = null;
let missionStart = Date.now();
let selectedAgent = null;
let feedStarted = false;

function getAgentColor(agentId) {
	if (!agentColors[agentId]) {
		agentColors[agentId] = colorIdx++ % 8;
	}
	return agentColors[agentId];
}

// SSE connection
function connect() {
	const source = new EventSource('/api/stream');

	source.onopen = () => {
		document.getElementById('connDot').className = 'dot connected';
		document.getElementById('connText').textContent = 'live';
	};

	source.onerror = () => {
		document.getElementById('connDot').className = 'dot disconnected';
		document.getElementById('connText').textContent = 'reconnecting...';
	};

	source.onmessage = (e) => {
		const data = JSON.parse(e.data);

		if (data.type === 'mission') {
			missionId = data.missionId;
			missionStart = Date.now();
			document.getElementById('missionId').textContent = missionId;
			document.getElementById('statStatus').textContent = 'running';
			return;
		}

		if (data.type === 'event') {
			handleEvent(data.event);
		}
	};
}

function handleEvent(event) {
	events.push(event);

	// Track agents
	if (event.kind === 'agent.spawn' && event.payload) {
		const p = event.payload;
		agents.set(p.agentId || event.agentId, {
			roleName: p.roleName || 'unknown',
			status: 'spawning',
			mandate: p.mandate || '',
			color: getAgentColor(p.agentId || event.agentId),
			events: [],
		});
	}

	// Update agent status
	const agent = agents.get(event.agentId);
	if (agent) {
		agent.events.push(event);
		if (event.kind === 'lifecycle.start') agent.status = 'active';
		if (event.kind === 'lifecycle.stop') agent.status = 'done';
		if (event.kind === 'lifecycle.crash') agent.status = 'failed';
	}

	// Track orchestrator events
	if (event.agentId === 'orchestrator' && !agents.has('orchestrator')) {
		agents.set('orchestrator', {
			roleName: 'orchestrator',
			status: 'active',
			mandate: 'Mission control',
			color: getAgentColor('orchestrator'),
			events: [],
		});
	}
	if (event.agentId === 'orchestrator') {
		const orch = agents.get('orchestrator');
		if (orch) orch.events.push(event);
	}

	// Mission status
	if (event.kind === 'gate.pass') {
		document.getElementById('statStatus').textContent = 'gate passed';
		document.getElementById('statStatus').style.color = '#3fb950';
	}
	if (event.kind === 'gate.fail') {
		document.getElementById('statStatus').textContent = 'gate failed';
		document.getElementById('statStatus').style.color = '#f85149';
	}

	// Update UI
	updateStats();
	updateAgentList();
	addToFeed(event);
	updateSwimlanes();
	updateRoster();
}

function updateStats() {
	document.getElementById('statEvents').textContent = events.length;
	document.getElementById('statAgents').textContent = agents.size;
	const elapsed = ((Date.now() - missionStart) / 1000).toFixed(0);
	document.getElementById('statTime').textContent = elapsed + 's';
}

// Update stats timer
setInterval(() => {
	if (events.length > 0) {
		const elapsed = ((Date.now() - missionStart) / 1000).toFixed(0);
		document.getElementById('statTime').textContent = elapsed + 's';
	}
}, 1000);

function updateAgentList() {
	const container = document.getElementById('agentList');
	if (agents.size === 0) return;

	container.innerHTML = Array.from(agents.entries()).map(([id, a]) => `
		<div class="agent-card ${selectedAgent === id ? 'selected' : ''}" onclick="selectAgent('${id}')">
			<div class="agent-name ac-${a.color}">${id}</div>
			<div class="agent-role">${a.roleName}</div>
			<div class="agent-status ${a.status}">${a.status} (${a.events.length} events)</div>
		</div>
	`).join('');
}

function selectAgent(agentId) {
	selectedAgent = selectedAgent === agentId ? null : agentId;
	updateAgentList();
	updateSwimlanes();
}

function addToFeed(event) {
	const container = document.getElementById('liveFeed');
	if (!feedStarted) {
		container.innerHTML = '';
		feedStarted = true;
	}

	const colorClass = `ac-${getAgentColor(event.agentId)}`;
	const kindClass = `k-${event.kind.split('.')[0]}`;
	const time = new Date(event.timestamp).toLocaleTimeString();
	const detail = event.payload ? summarize(event.payload) : '';

	const div = document.createElement('div');
	div.className = 'feed-event';
	div.onclick = () => showDetail(event.kind, JSON.stringify(event.payload, null, 2));
	div.innerHTML = `
		<span class="feed-time">${time}</span>
		<span class="feed-agent ${colorClass}">${event.agentId}</span>
		<span class="feed-kind ${kindClass}">${event.kind}</span>
		<span class="feed-detail">${detail}</span>
	`;

	container.appendChild(div);

	// Auto-scroll to bottom
	const panel = container.closest('.panel-container');
	if (panel) panel.scrollTop = panel.scrollHeight;
}

function summarize(payload) {
	if (!payload) return '';
	if (typeof payload === 'string') return payload;

	// Smart summaries for known event types
	if (payload.toolName) return `tool: ${payload.toolName}`;
	if (payload.agentId && payload.roleName) return `${payload.agentId} (${payload.roleName})`;
	if (payload.mandate) return payload.mandate.slice(0, 80);
	if (payload.path) return payload.path;
	if (payload.paths) return payload.paths.join(', ');
	if (payload.to) return `to: ${payload.to}`;
	if (payload.capability) return payload.capability;
	if (payload.decision) return payload.decision.slice(0, 80);
	if (payload.error) return payload.error.slice(0, 80);
	if (payload.reason) return payload.reason;
	if (payload.status) return payload.status;
	if (payload.durationMs) return `${payload.durationMs}ms`;

	const str = JSON.stringify(payload);
	return str.length > 100 ? str.slice(0, 100) + '...' : str;
}

function updateSwimlanes() {
	const container = document.getElementById('swimContent');
	if (agents.size === 0) return;

	const agentsToShow = selectedAgent
		? [[selectedAgent, agents.get(selectedAgent)]]
		: Array.from(agents.entries());

	container.innerHTML = agentsToShow.map(([id, a]) => {
		if (!a) return '';
		return `
			<div class="swimlane">
				<div class="swimlane-header">
					<span class="ac-${a.color}">${id}</span>
					<span class="swimlane-count">${a.events.length} events</span>
				</div>
				${a.events.map(e => {
					const kindClass = `k-${e.kind.split('.')[0]}`;
					const detail = e.payload ? summarize(e.payload) : '';
					return `<div class="feed-event" onclick="showDetail('${e.kind}', ${JSON.stringify(JSON.stringify(e.payload, null, 2))})">
						<span class="feed-time">${new Date(e.timestamp).toLocaleTimeString()}</span>
						<span class="feed-kind ${kindClass}">${e.kind}</span>
						<span class="feed-detail">${detail}</span>
					</div>`;
				}).join('')}
			</div>
		`;
	}).join('');
}

function updateRoster() {
	const container = document.getElementById('rosterContent');
	const spawns = events.filter(e => e.kind === 'agent.spawn');
	if (spawns.length === 0) return;

	container.innerHTML = spawns.map(e => {
		const p = e.payload || {};
		const a = agents.get(p.agentId);
		const status = a ? a.status : 'unknown';
		return `
			<div class="feed-event" style="padding:8px 12px;border-left:3px solid;border-color:var(--c,#58a6ff)">
				<span class="feed-time">${new Date(e.timestamp).toLocaleTimeString()}</span>
				<span class="feed-agent ac-${getAgentColor(p.agentId)}">${p.agentId || '?'}</span>
				<span class="feed-kind" style="color:#8b949e;min-width:100px">${p.roleName || '?'}</span>
				<span class="agent-status ${status}" style="min-width:60px">${status}</span>
				<span class="feed-detail">${(p.mandate || '').slice(0, 80)}</span>
			</div>
		`;
	}).join('');
}

function switchTab(name) {
	document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
	document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
	document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
	document.getElementById(name).classList.add('active');
}

function showDetail(title, body) {
	document.getElementById('modalTitle').textContent = title;
	document.getElementById('modalBody').textContent = body;
	document.getElementById('modal').classList.add('active');
}

function closeModal() {
	document.getElementById('modal').classList.remove('active');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Start
connect();
</script>

</body>
</html>
