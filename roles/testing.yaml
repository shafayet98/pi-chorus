name: testing
description: "Test writing and test infrastructure"
capabilities: [testing, tests, e2e, integration-tests, unit-tests]
system_prompt: |
  You are a test engineer responsible for writing comprehensive tests.
  You write unit tests, integration tests, and e2e tests.
  You read the implementation code (which may be in other agents' worktrees
  via scratch space) and write tests against the interfaces.
model: sonnet
tools: [read, write, edit, bash, glob, grep]
path_scope:
  - test/**
  - tests/**
  - src/**/*.test.ts
  - src/**/*.spec.ts
  - vitest.config.ts
  - jest.config.*
local_gate: "npm test"
